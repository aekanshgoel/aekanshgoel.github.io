<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.name }}</a>
    <div class="header-end">
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/writing/' | relative_url }}" {% if page.url == '/writing/' or page.url == '/writing' or page.layout == 'post' %}aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' or page.url == '/about.html' %}aria-current="page"{% endif %}>About</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
      </button>
    </div>
  </div>
</header>
