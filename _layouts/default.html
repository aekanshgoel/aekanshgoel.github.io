<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>
    {% include seo.html %}
    <meta name="color-scheme" content="light dark">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="frame">
      <aside class="spine" aria-hidden="true">
        <p class="spine-type">{{ site.name }} <span class="spine-year">{{ 'now' | date: '%Y' }}</span></p>
      </aside>
      <div class="sheet">
        {% include header.html %}
        <main id="main" class="site-main">{{ content }}</main>
        {% include footer.html %}
      </div>
    </div>
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
